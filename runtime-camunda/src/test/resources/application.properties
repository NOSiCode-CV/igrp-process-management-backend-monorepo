spring.application.name=Runtime Camunda Engine

camunda.client.mode=self-managed
camunda.client.zeebe.enabled=true
camunda.client.zeebe.grpc-address=http://127.0.0.1:26500
camunda.client.zeebe.rest-address=http://127.0.0.1:8080

# Operate client configuration
operate.client.profile=oidc
operate.client.enabled=true
operate.client.base-url=http://localhost:8081
operate.client.auth-url=http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token
operate.client.audience=operate-api
operate.client.client-id=zeebe
operate.client.client-secret=zecret

# Optional fields (leave blank or remove if not used)
# operate.client.scope=
# operate.client.resource=
# operate.client.client-assertion-keystore-path=
# operate.client.client-assertion-keystore-password=
# operate.client.client-assertion-keystore-key-alias=
# operate.client.client-assertion-keystore-key-password=
